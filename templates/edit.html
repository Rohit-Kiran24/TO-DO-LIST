{% extends 'base.html'%}

{%block head %}
<title>Task Smash</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
{%endblock%}

{% block body%}
<div class="content">
    <h1>Edit your task</h1>
    <form action="/edit/{{task.id}}" method="POST"> 
        <input type="text" name="content" id="content" value="{{task.content}}" placeholder="Edit your task...">
        <input type="submit" value="Save Changes" id="btn_add">
    </form>
</div>
{%endblock%}
